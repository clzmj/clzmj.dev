name: Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clzmj-dev-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Require the site package
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            echo "::error::package.json is missing, so the site cannot be built. The app has not landed on this ref."
            exit 1
          fi
          if [[ ! -f bun.lock && ! -f bun.lockb ]]; then
            echo "::error::bun.lock is missing. Commit the Bun lockfile so CI can install dependencies reproducibly."
            exit 1
          fi

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.4-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-1.4.4-${{ runner.os }}-

      - name: Install and build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          if [[ ! -d out ]]; then
            echo "::error::The build did not produce an out/ directory. The site must be a Next.js static export."
            exit 1
          fi

      - name: Deploy the Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ ! -f wrangler.jsonc ]]; then
            echo "::error::wrangler.jsonc is missing. The Worker config has not landed on this ref."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::A Doppler-synced Cloudflare secret is missing from the production environment."
            exit 1
          fi
          bunx wrangler@4.156.2 deploy

  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Apply
        shell: bash
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${TF_VAR_cloudflare_account_id}" || -z "${TF_VAR_cloudflare_zone_id}" || -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" || -z "${TF_STATE_BUCKET}" ]]; then
            echo "::error::A Doppler-synced secret is missing from the production environment."
            exit 1
          fi
          if [[ "${TF_STATE_BUCKET}" != "clzmj-dev-tfstate" ]]; then
            echo "::error::TF_STATE_BUCKET does not match the bucket declared in infra/backend.tf."
            exit 1
          fi
          terraform fmt -check -recursive
          terraform init -input=false -no-color
          terraform validate -no-color
          terraform plan -input=false -no-color -out=tfplan
          terraform apply -input=false -auto-approve tfplan
