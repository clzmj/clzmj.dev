name: Pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: clzmj-dev-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml # zizmor: ignore[self-repository] Local reusable workflow is bound to the caller commit.
    secrets: inherit # zizmor: ignore[secrets-inherit] Required CI contract; site jobs explicitly use the ci environment.

  plan:
    name: Terraform plan
    # The reusable call includes the Terraform check; its jobs cannot be addressed here.
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ci
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Check formatting, validate, and plan
        id: terraform
        shell: bash
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          {
            if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${TF_VAR_cloudflare_account_id}" || -z "${TF_VAR_cloudflare_zone_id}" || -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" || -z "${TF_STATE_BUCKET}" ]]; then
              echo "::error::A Doppler-synced secret is missing from the ci environment."
              exit 1
            fi
            if [[ "${TF_STATE_BUCKET}" != "clzmj-dev-tfstate" ]]; then
              echo "::error::TF_STATE_BUCKET does not match the bucket declared in infra/backend.tf."
              exit 1
            fi
            terraform fmt -check -recursive
            terraform init -input=false -no-color
            terraform validate -no-color
            terraform plan -lock=false -input=false -no-color -out=tfplan
          } 2>&1 | tee plan.txt

      - name: Publish the plan comment
        if: always() && steps.terraform.outcome != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_OUTCOME: ${{ steps.terraform.outcome }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- clzmj-dev-terraform-plan -->";
            const outcome = process.env.PLAN_OUTCOME;
            let plan = "Terraform produced no output.";
            const planPath = "infra/plan.txt";
            if (fs.existsSync(planPath)) {
              const text = fs.readFileSync(planPath, "utf8").trim();
              if (text.length > 0) {
                plan = text;
              }
            }
            const max = 60000;
            if (plan.length > max) {
              plan = plan.slice(0, max) + "\n...[truncated]";
            }
            plan = plan.replace(/```/g, "'''");
            const title = outcome === "success" ? "Terraform plan" : "Terraform plan failed";
            const body = [
              marker,
              `## ${title}`,
              "",
              "Read-only plan from the `ci` environment (`terraform plan -lock=false`). This does not deploy the Worker and does not change production.",
              "",
              "```hcl",
              plan,
              "```",
              "",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
